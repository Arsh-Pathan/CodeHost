name: codehost

services:
  # --- Core Infrastructure ---
  postgres:
    image: postgres:15-alpine
    container_name: codehost-db
    environment:
      POSTGRES_USER: ${DB_USER:-codehost}
      POSTGRES_PASSWORD: ${DB_PASS:-securepass}
      POSTGRES_DB: ${DB_NAME:-codehost}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  redis:
    image: redis:7-alpine
    container_name: codehost-redis
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  # --- CodeHost Services ---
  api:
    image: ghcr.io/arsh-pathan/codehost-api:latest
    container_name: codehost-api
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-codehost}:${DB_PASS:-securepass}@postgres:5432/${DB_NAME:-codehost}?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      VIRTUAL_HOST: ${API_DOMAIN:-api.code-host.online}
      VIRTUAL_PORT: 4000
      VIRTUAL_NETWORK: proxy
      LETSENCRYPT_HOST: ${API_DOMAIN:-api.code-host.online}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@code-host.online}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:rw"
      - "../data/api_tmp:/app/tmp"
      - "../data/api_storage:/app/storage"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - default
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  web:
    image: ghcr.io/arsh-pathan/codehost-web:latest
    container_name: codehost-web
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.code-host.online}
      INTERNAL_API_URL: http://api:4000
      VIRTUAL_HOST: ${DOMAIN:-code-host.online},www.${DOMAIN:-code-host.online}
      VIRTUAL_PORT: 3000
      VIRTUAL_NETWORK: proxy
      LETSENCRYPT_HOST: ${DOMAIN:-code-host.online},www.${DOMAIN:-code-host.online}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@code-host.online}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - default
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

networks:
  proxy:
    external: true
