name: codehost

services:
  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-https://api.code-host.online}
    container_name: codehost-web
    user: "${PUID}:${PGID}"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.code-host.online}
      VIRTUAL_HOST: code-host.online,www.code-host.online
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: code-host.online,www.code-host.online
      LETSENCRYPT_EMAIL: admin@code-host.online
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - internal
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

networks:
  proxy:
    external: true
  internal:
    external: true
    name: codehost_internal
