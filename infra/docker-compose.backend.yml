name: codehost

services:
  traefik:
    image: traefik:latest
    container_name: codehost-proxy
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=*.code-host.online
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=*.code-host.online
      - LETSENCRYPT_EMAIL=admin@code-host.online
    networks:
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  api:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    container_name: codehost-api
    user: "${PUID}:${PGID}"
    env_file:
      - .env
    environment:
      PORT: 4000
      VIRTUAL_HOST: api.code-host.online
      VIRTUAL_PORT: 4000
      LETSENCRYPT_HOST: api.code-host.online
      LETSENCRYPT_EMAIL: admin@code-host.online
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:rw"
    restart: unless-stopped
    networks:
      - internal
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

networks:
  proxy:
    external: true
  internal:
    external: true
    name: codehost_internal
